schema_version: 1
workspace_root: .

project:
  id: mh3-rmhj08
  display_name: Monster Hunter Tri JPN
  game_id: RMHJ08
  region: J

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x808A4880
  sda2_base: 0x808A93C0

inputs:
  dol:
    path: Assets/DATA/sys/main.dol
    sha256: 994d489161983c438987fb59abe1d9127ed25e4892088a0a61e12e3b47244972

translation:
  function_map:
    path: build/MAP.txt
  entry_points:
    - 0x8000403C
  allow_unsupported_instructions: false
  # Step counter reads answered in game time (scripts/step_counter_sites.py).
  load_hooks_path: runtime/src/step_counter_sites.inc
  # Step counters and countdowns advanced by the ticks of each step (tick_sites.cpp).
  tick_sites_path: runtime/src/tick_sites.inc
  # Functions whose accesses may reach hardware; all others use flat guest memory.
  hardware_access_path: runtime/src/hardware_access.inc
  # Functions that use the uncached, physical or locked-cache aliases; all
  # others address cached RAM with one add (runtime MemoryInline).
  alias_access_path: runtime/src/alias_access.inc
  # Panics and fatal errors end the game, so callers need not take on their
  # complete-context call boundary (nw4r::db::Panic, OSPanic, OSFatal).
  no_return_functions:
    - 0x804F42D4
    - 0x804241EC
    - 0x8042632C

# Mario Kart's address-specific native registrations must not be used for MH3.
runtime:
  native_registration_root: runtime/src
  native_abi_directories: []

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  # Not built: the runtime reads the DOL from the disc (runtime/src/dol_sections.cpp).
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/mh3_base_manifest.json
